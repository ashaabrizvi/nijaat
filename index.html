<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dar-e-Nijaat · The Door of Return</title>
    <meta name="description" content="Beyond the drama: what nijaat really means. A gentle, private companion for tawbah, salah, Qur’an and walking back to Allah, in English and Urdu." />
    <meta name="theme-color" content="#FBF4E8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dar-e-Nijaat" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:title" content="Dar-e-Nijaat · The Door of Return" />
    <meta property="og:description" content="Beyond the drama: what nijaat really means. Tawbah, salah, Qur’an: one gentle step at a time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./icons/icon-512.png" />
    <script>
      // Apply saved theme/language before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('dar-e-nijaat:v2') || '{}');
          var h = new Date().getHours();
          var t = s.theme === 'day' || s.theme === 'night' ? s.theme : h >= 19 || h < 5 ? 'night' : 'day';
          document.documentElement.dataset.theme = t;
          if (s.lang === 'ur') { document.documentElement.lang = 'ur'; document.documentElement.dir = 'rtl'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Dar-e-Nijaat needs JavaScript to open the door.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
