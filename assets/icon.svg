<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6c56"/>
      <stop offset="1" stop-color="#244536"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="68%" r="70%">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset=".5" stop-color="#fcdf9e"/>
      <stop offset="1" stop-color="#e7b45c"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#e7c98f" stroke-opacity=".10" stroke-width="2">
    <rect x="40" y="40" width="64" height="64"/><rect x="40" y="40" width="64" height="64" transform="rotate(45 72 72)"/>
    <rect x="408" y="40" width="64" height="64"/><rect x="408" y="40" width="64" height="64" transform="rotate(45 440 72)"/>
    <rect x="40" y="408" width="64" height="64"/><rect x="40" y="408" width="64" height="64" transform="rotate(45 72 440)"/>
    <rect x="408" y="408" width="64" height="64"/><rect x="408" y="408" width="64" height="64" transform="rotate(45 440 440)"/>
  </g>
  <ellipse cx="256" cy="300" rx="200" ry="190" fill="url(#aura)"/>
  <!-- frame -->
  <path d="M146 400 V236 A110 110 0 0 1 366 236 V400 Z" fill="#e7c98f"/>
  <!-- opening with light -->
  <path d="M166 400 V240 A90 90 0 0 1 346 240 V400 Z" fill="url(#light)"/>
  <!-- door leaves, ajar -->
  <path d="M166 400 V240 A90 90 0 0 1 200 170 V412 Z" fill="#7a4b2c"/>
  <path d="M346 400 V240 A90 90 0 0 0 312 170 V412 Z" fill="#7a4b2c"/>
  <!-- star -->
  <g transform="translate(256 112)" fill="#f2cf86">
    <rect x="-20" y="-20" width="40" height="40" rx="3"/>
    <rect x="-20" y="-20" width="40" height="40" rx="3" transform="rotate(45)"/>
    <circle r="8" fill="#355f4b"/>
  </g>
  <!-- step -->
  <rect x="124" y="398" width="264" height="16" rx="8" fill="#c9973f"/>
</svg>
